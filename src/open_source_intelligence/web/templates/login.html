{% extends "base.html" %}
{% block title %}登录 · 开源情报周报平台{% endblock %}
{% block content %}
<section class="card">
  <a class="brand" href="/ui/login">
    <span class="brand-name">开源情报周报平台</span>
    <span class="brand-sub">采集 → 研究 → 发布</span>
  </a>
  {% if error %}<p class="alert error">{{ error }}</p>{% endif %}
  <form method="post" action="/ui/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>
      <span>用户名</span>
      <input type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label>
      <span>密码</span>
      <input type="password" name="password" id="password" autocomplete="current-password" required>
    </label>
    <label class="checkbox-line">
      <input type="checkbox" id="show-password">
      <span>显示密码</span>
    </label>
    <button type="submit" class="primary">登录</button>
  </form>
  <p class="hint">会话保存在 HttpOnly Cookie 中，表单提交带 CSRF 校验。</p>
</section>
<script>
  (function () {
    var toggle = document.getElementById("show-password");
    var field = document.getElementById("password");
    if (toggle && field) {
      toggle.addEventListener("change", function () {
        field.type = toggle.checked ? "text" : "password";
      });
    }
  })();
</script>
{% endblock %}
