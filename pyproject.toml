[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-source-intelligence-agent"
version = "0.1.0"
description = "Enterprise open-source intelligence research agent and weekly report platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=21.3,<26",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "langgraph>=1.0,<2",
  "mistune>=2,<4",
  "pydantic-settings>=2.5,<3",
  "pymysql>=1.1,<2",
  "PyJWT>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "redis>=5,<7",
  "sqlalchemy>=2.0,<2.1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# Pinned to the versions the suite is actually verified against locally. The loose ranges used
# before (`mypy>=1.11,<2`, `pytest>=8,<10`) let CI resolve to much newer releases, which changed
# mypy's strictness and pytest's collection behavior. `requirements-ci.txt` mirrors these pins for
# the complete CI environment so local and remote gates stay reproducible.
# `pytest-asyncio` was dropped: the suite has no async tests, and its `pytest>=8.2` floor
# conflicts with the pinned pytest anyway.
dev = [
  "mypy==1.11.2",
  "pytest==7.4.4",
  "ruff==0.16.10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_source_intelligence = [
  "web/templates/*.html",
  "web/templates/partials/*.html",
  "web/static/*",
]

[tool.pytest.ini_options]
addopts = "-q"
# `scripts` is on the path so the tests can import the smoke drills directly: the drill cleanups
# are the thing under test in `tests/scripts/`, and several drills already import each other by
# bare module name.
pythonpath = ["src", "tests", "scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["open_source_intelligence"]
# SQLAlchemy 2.0 ships native PEP 484 annotations, so its mypy plugin has been deprecated
# since 2.0 and was removed in 2.1. The project pins `sqlalchemy<2.1` and CI installs 2.0.34,
# so only pydantic's plugin is needed; declaring `sqlalchemy.ext.mypy.plugin` would fail on 2.1.
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mistune"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# SQLAlchemy's MySQL dialect constructors are untyped even in 2.0. Keep the exception scoped
# to this adapter module instead of sprinkling inline ignores that newer mypy calls unused.
module = ["open_source_intelligence.persistence.base"]
disable_error_code = ["no-untyped-call"]
