name: open-source-intelligence-agent

# --- GitHub hosts override -----------------------------------------------------
# Watt Toolkit (Steam++ Accelerator) writes `127.0.0.1 api.github.com` (and ~27 other github
# hosts) into the Windows hosts file and answers them from a local 443 proxy. The host can then
# "reach" GitHub, but a Docker container resolves those names to its *own* loopback, where no
# such proxy exists, so collection gets `Connection refused`. Pinning `api.github.com` to its
# real address in the container (an `extra_hosts` entry) bypasses the poisoned host DNS and
# restores collection. GitHub's edge address rotates, so if collection starts failing with TLS or
# connect errors again, refresh the IP below:
#
#     nslookup api.github.com 8.8.8.8        # or 114.114.114.114
#
# and update `x-github-hosts`. Only `api.github.com` is needed — the collector reads search
# results and READMEs exclusively through the GitHub API (`collectors/github.py`).
x-github-hosts: &github-hosts
  - "api.github.com:20.205.243.168"

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-local}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  API_HOST: ${API_HOST:-0.0.0.0}
  API_PORT: ${API_PORT:-8000}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  SECRET_KEY: ${SECRET_KEY}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
  GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
  HUGGINGFACE_API_BASE: ${HUGGINGFACE_API_BASE:-https://hf-mirror.com/api}
  PIPELINE_SCHEDULE_ENABLED: ${PIPELINE_SCHEDULE_ENABLED:-true}
  PIPELINE_SCHEDULE_HOUR: ${PIPELINE_SCHEDULE_HOUR:-2}
  PIPELINE_SCHEDULE_MINUTE: ${PIPELINE_SCHEDULE_MINUTE:-0}
  PIPELINE_COLLECT_LIMIT: ${PIPELINE_COLLECT_LIMIT:-20}
  PIPELINE_TASK_MAX_RETRIES: ${PIPELINE_TASK_MAX_RETRIES:-2}
  PIPELINE_RETRY_BACKOFF_SECONDS: ${PIPELINE_RETRY_BACKOFF_SECONDS:-30}
  AGENT_ENABLED: ${AGENT_ENABLED:-true}
  AGENT_PROVIDER: ${AGENT_PROVIDER:-offline}
  AGENT_MODEL: ${AGENT_MODEL:-offline-deterministic-v1}
  AGENT_API_BASE: ${AGENT_API_BASE:-}
  AGENT_API_KEY: ${AGENT_API_KEY:-}
  AGENT_PROMPT_VERSION: ${AGENT_PROMPT_VERSION:-v1}
  AGENT_MAX_LOOPS: ${AGENT_MAX_LOOPS:-4}
  AGENT_MAX_MODEL_CALLS: ${AGENT_MAX_MODEL_CALLS:-6}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-20}
  AGENT_MAX_TOKENS: ${AGENT_MAX_TOKENS:-30000}
  AGENT_MAX_COST: ${AGENT_MAX_COST:-0.50}
  AGENT_INPUT_PRICE_PER_MTOK: ${AGENT_INPUT_PRICE_PER_MTOK:-0.14}
  AGENT_OUTPUT_PRICE_PER_MTOK: ${AGENT_OUTPUT_PRICE_PER_MTOK:-0.28}
  AGENT_MAX_CANDIDATES: ${AGENT_MAX_CANDIDATES:-5}
  AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-60}
  AGENT_PROMPTS_DIR: ${AGENT_PROMPTS_DIR:-}
  AGENT_AUTO_RESEARCH_ENABLED: ${AGENT_AUTO_RESEARCH_ENABLED:-false}
  AGENT_DAILY_RESEARCH_LIMIT: ${AGENT_DAILY_RESEARCH_LIMIT:-2}
  PUBLISH_DELAY_MINUTES: ${PUBLISH_DELAY_MINUTES:-60}
  PUBLISH_MIN_CITATION_COVERAGE: ${PUBLISH_MIN_CITATION_COVERAGE:-1.0}
  PUBLISH_SWEEP_MINUTES: ${PUBLISH_SWEEP_MINUTES:-15}
  PUSH_ENABLED: ${PUSH_ENABLED:-true}
  PUSH_AUTO_AFTER_PUBLISH: ${PUSH_AUTO_AFTER_PUBLISH:-true}
  PUSH_DELIVERY: ${PUSH_DELIVERY:-offline}
  PUSH_MAX_ATTEMPTS: ${PUSH_MAX_ATTEMPTS:-3}
  PUSH_RETRY_BACKOFF_SECONDS: ${PUSH_RETRY_BACKOFF_SECONDS:-60}
  PUSH_RETRY_INTERVAL_MINUTES: ${PUSH_RETRY_INTERVAL_MINUTES:-15}
  PUSH_TIMEOUT_SECONDS: ${PUSH_TIMEOUT_SECONDS:-20}
  PUSH_EMAIL_FROM: ${PUSH_EMAIL_FROM:-}
  PUSH_SMTP_HOST: ${PUSH_SMTP_HOST:-}
  PUSH_SMTP_PORT: ${PUSH_SMTP_PORT:-587}
  PUSH_SMTP_USERNAME: ${PUSH_SMTP_USERNAME:-}
  PUSH_SMTP_PASSWORD: ${PUSH_SMTP_PASSWORD:-}
  PUSH_SMTP_STARTTLS: ${PUSH_SMTP_STARTTLS:-true}
  PUSH_WEBHOOK_SIGNING_SECRET: ${PUSH_WEBHOOK_SIGNING_SECRET:-}
  PUSH_WEBHOOK_ALLOW_PRIVATE_TARGETS: ${PUSH_WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}
  PUSH_WEBHOOK_CA_BUNDLE: ${PUSH_WEBHOOK_CA_BUNDLE:-}
  EVAL_ENABLED: ${EVAL_ENABLED:-true}
  EVAL_REGRESSION_TOLERANCE: ${EVAL_REGRESSION_TOLERANCE:-0.02}

x-app-image: &app-image
  build:
    context: ..
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
  image: open-source-intelligence-agent:local
  restart: unless-stopped

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-image
    environment: *app-environment
    extra_hosts: *github-hosts
    command: ["python", "-m", "uvicorn", "open_source_intelligence.api.app:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    <<: *app-image
    environment: *app-environment
    extra_hosts: *github-hosts
    command: ["python", "-m", "celery", "-A", "open_source_intelligence.workers.celery_entry:app", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    <<: *app-image
    environment: *app-environment
    extra_hosts: *github-hosts
    command: ["python", "-m", "celery", "-A", "open_source_intelligence.workers.celery_entry:app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  mysql-data:
